<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Personal</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="frame">

        <!-- Círculos decorativos -->
        <span class="circulo circulo-1"></span>
        <span class="circulo circulo-2"></span>
        <span class="circulo circulo-3"></span>
        <span class="circulo circulo-4"></span>
        <span class="circulo circulo-5"></span>
        <span class="circulo circulo-6"></span>
        <span class="circulo circulo-7"></span>

        <h1 class="titulo">Cadastro Personal:</h1>

        <div class="card-cadastro">
            <form class="form-cadastro">

                <div class="form-campos">
                    <input type="text" name="nome" placeholder="Nome">
                    <input type="email" name="email" placeholder="Email">
                    <input type="text" name="telefone" placeholder="Telefone">
                    <input type="number" name="idade" placeholder="Idade">
                    <input type="text" name="cep" placeholder="CEP">
                </div>

                <div class="form-imagem">
                    <p>Add imagem de seu próprio</p>
                    <div class="upload-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7l9-4 9 4-9 4-9-4z"></path>
                            <path d="M3 12l9 4 9-4"></path>
                            <path d="M3 17l9 4 9-4"></path>
                        </svg>
                        <span class="upload-plus">+</span>
                    </div>
                </div>

            </form>

            <button type="submit" class="btn-enviar">Enviar</button>
        </div>

    </div>

</body>
</html>
